plugins {
    id 'java-library'
    id 'jacoco'
    id 'checkstyle'
    id 'com.diffplug.spotless' version '8.4.0'
    id 'com.google.protobuf' version '0.10.0'
}

group = 'com.nereusstream'
version = '0.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
    withJavadocJar()
}

dependencies {
    api 'org.rocksdb:rocksdbjni:10.1.3'
    api 'io.github.oxia-db:oxia-client:0.9.0'
    implementation platform('io.grpc:grpc-bom:1.75.0')
    implementation 'io.grpc:grpc-netty-shaded'
    implementation 'com.google.protobuf:protobuf-java:4.35.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'io.grpc:grpc-protobuf'
    implementation 'io.grpc:grpc-stub'
    compileOnly 'javax.annotation:javax.annotation-api:1.3.2'
    implementation platform('io.opentelemetry:opentelemetry-bom:1.63.0')
    implementation platform('io.opentelemetry:opentelemetry-bom-alpha:1.63.0-alpha')
    implementation 'io.opentelemetry:opentelemetry-api:1.63.0'

    // The opt-in real Kafka/Pulsar client smokes load upstream client jars
    // directly, so their SLF4J API must be present on the JavaExec classpath.
    runtimeOnly 'org.slf4j:slf4j-api:2.0.17'
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.17'

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Oxia's structured logger discovers a backend only when a real client is opened.
    // Keep the default library surface backend-neutral, but make the opt-in real-service
    // test runnable from Gradle without relying on a host application's logging setup.
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.17'
}

// Real upstream client bindings are opt-in. The shared semantic/core
// build must remain independent of Kafka/Pulsar client classes; callers that
// have the locked K1 artifact can run `compileRealKafka` with
// `-PkafkaClientJar=/absolute/path/to/kafka-clients.jar`.
sourceSets {
    main {
        resources.srcDir(layout.buildDirectory.dir('generated/resources/source-identity'))
    }
    realKafka {
        java.srcDir('src/real-kafka/java')
    }
    realPulsar {
        java.srcDir('src/real-pulsar/java')
    }
    realCross {
        java.srcDir('src/real-cross/java')
    }
}

def runningArtifactIdentityDir = layout.buildDirectory.dir('generated/resources/source-identity')
tasks.register('generateRunningArtifactIdentity') {
    description = 'Generates the source commit and cleanliness bound into the runnable artifact.'
    outputs.dir(runningArtifactIdentityDir)
    outputs.upToDateWhen { false }
    doLast {
        def runGit = { List<String> arguments ->
            def process = new ProcessBuilder(['git'] + arguments)
                    .directory(rootDir)
                    .redirectErrorStream(true)
                    .start()
            def output = process.inputStream.getText('UTF-8').trim()
            if (process.waitFor() != 0) {
                throw new GradleException("cannot resolve running artifact source identity: ${output}")
            }
            return output
        }
        def commit = runGit(['rev-parse', 'HEAD'])
        if (!(commit ==~ /[0-9a-f]{40}/)) {
            throw new GradleException('git returned a non-canonical source commit')
        }
        def trackedStatus = runGit(['status', '--porcelain'])
        def outputDir = runningArtifactIdentityDir.get().asFile
        def identity = new File(outputDir, 'META-INF/nereus-delay-source-identity.properties')
        identity.parentFile.mkdirs()
        identity.setText("sourceCommit=${commit}\ntrackedSourceClean=${trackedStatus.isEmpty()}\n", 'UTF-8')
    }
}

tasks.named('processResources').configure {
    dependsOn tasks.named('generateRunningArtifactIdentity')
}

// The default source-set compile tasks have no artifact classpath until the
// caller supplies one.  The explicit tasks below own that opt-in boundary.
tasks.named('compileRealKafkaJava').configure { enabled = false }
tasks.named('compileRealPulsarJava').configure { enabled = false }
tasks.named('compileRealCrossJava').configure { enabled = false }

def realKafkaClientJar = findProperty('kafkaClientJar')
def realPulsarClientClasspath = findProperty('pulsarClientClasspath')
def realPulsarRuntimeDir = findProperty('pulsarRuntimeDir')
// Keep opt-in tasks discoverable when their runtime inputs are intentionally
// absent.  The task actions below retain the explicit fail-on-missing checks;
// these empty collections only prevent Gradle's configuration phase from
// dereferencing null while listing or importing the task graph.
def realKafkaClientFiles = realKafkaClientJar == null ? files() : files(realKafkaClientJar)
def realPulsarClientFiles = realPulsarClientClasspath == null
        ? files() : files(realPulsarClientClasspath.split(File.pathSeparator))
def realPulsarRuntimeFiles = realPulsarRuntimeDir == null
        ? files() : fileTree(realPulsarRuntimeDir).include('**/*.jar')
project.ext.optionalRealTaskArgument = { value -> value == null ? '' : value.toString() }

tasks.register('compileRealKafka', JavaCompile) {
    group = 'verification'
    description = 'Compiles the Delay Kafka binding against an explicitly supplied locked K1 client artifact.'
    dependsOn tasks.named('classes')
    if (realKafkaClientJar == null) {
        doFirst {
            throw new GradleException('compileRealKafka requires -PkafkaClientJar=/absolute/path/to/kafka-clients.jar')
        }
    }
    source = sourceSets.realKafka.java
    // The shared main API exposes Oxia-backed authority constructors. Keep
    // upstream Kafka isolated, but make the shared main compile dependencies
    // visible when javac resolves those public signatures.
    classpath = files(sourceSets.main.output, sourceSets.main.compileClasspath, realKafkaClientFiles)
    destinationDirectory = layout.buildDirectory.dir('classes/java/realKafka')
    options.release = 21
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all', '-Werror']
}

tasks.register('runRealKafkaSmoke', JavaExec) {
    group = 'verification'
    description = 'Runs the K1-to-Delay binding against an explicitly supplied Kafka broker.'
    dependsOn tasks.named('compileRealKafka')
    if (realKafkaClientJar == null || findProperty('kafkaBootstrap') == null || findProperty('kafkaTopic') == null) {
        doFirst {
            throw new GradleException(
                    'runRealKafkaSmoke requires -PkafkaClientJar=... -PkafkaBootstrap=host:port -PkafkaTopic=name')
        }
    }
    classpath = files(sourceSets.main.runtimeClasspath, sourceSets.realKafka.output, realKafkaClientFiles)
    mainClass = 'com.nereusstream.delay.transport.KafkaClientArtifactSmoke'
    args project.ext.optionalRealTaskArgument.call(findProperty('kafkaBootstrap')),
            project.ext.optionalRealTaskArgument.call(findProperty('kafkaTopic'))
    if (findProperty('smokeMode') != null) {
        args findProperty('smokeMode')
    }
}

