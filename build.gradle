    classpath = files(sourceSets.main.runtimeClasspath, sourceSets.realKafka.output, realKafkaClientJar)
    mainClass = 'io.nereusstream.delay.transport.KafkaClientArtifactRouteWorkerSmoke'
    args findProperty('kafkaBootstrap'), findProperty('kafkaRouteWorkerTopic')
