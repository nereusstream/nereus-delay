plugins {
    id 'java-library'
    id 'jacoco'
    id 'checkstyle'
    id 'com.google.protobuf' version '0.10.0'
}

group = 'io.nereusstream'
version = '0.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
    withJavadocJar()
}

dependencies {
    api 'org.rocksdb:rocksdbjni:10.1.3'
    api 'io.github.oxia-db:oxia-client:0.9.0'
    implementation platform('io.grpc:grpc-bom:1.75.0')
    implementation 'io.grpc:grpc-netty-shaded'
    implementation 'com.google.protobuf:protobuf-java:4.35.0'
    implementation 'io.grpc:grpc-protobuf'
    implementation 'io.grpc:grpc-stub'
    compileOnly 'javax.annotation:javax.annotation-api:1.3.2'
    implementation platform('io.opentelemetry:opentelemetry-bom:1.63.0')
    implementation platform('io.opentelemetry:opentelemetry-bom-alpha:1.63.0-alpha')
    implementation 'io.opentelemetry:opentelemetry-api:1.63.0'

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Oxia's structured logger discovers a backend only when a real client is opened.
    // Keep the default library surface backend-neutral, but make the opt-in real-service
    // test runnable from Gradle without relying on a host application's logging setup.
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.17'
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:4.35.0'
    }
    plugins {
        grpc {
            artifact = 'io.grpc:protoc-gen-grpc-java:1.75.0'
        }
    }
    generateProtoTasks {
        all().configureEach {
            plugins {
                grpc {}
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs += ['-Xlint:all', '-Werror']
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.addBooleanOption('Xdoclint:all', true)
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    failFast = false
    testLogging {
        events 'failed', 'skipped'
    }
}

checkstyle {
    toolVersion = '10.26.1'
    configFile = file('config/checkstyle/checkstyle.xml')
    maxWarnings = 0
}

tasks.withType(Checkstyle).configureEach {
    exclude '**/generated/**'
}

tasks.named('checkstyleMain').configure {
    source = fileTree('src/main/java')
}

tasks.named('checkstyleTest').configure {
    enabled = false
}

def v1DocumentPaths = [
        'CONTEXT.md',
        'docs/README.md',
        'docs/Nereus Delay V1 设计.md',
        'docs/V1-DIRECT-SDK-GATEWAY-GUARDED-TRANSPORT-DETAILED-DESIGN.md',
        'docs/V1-PROTOCOL-REGISTRY.md',
        'docs/IMPLEMENTATION-STATUS.md',
        'docs/V1-DESIGN-AUDIT.md',
        'docs/adr/README.md',
        'docs/adr/0043-share-one-semantic-core-across-direct-sdk-and-delay-gateway.md',
        'docs/adr/0044-use-first-class-guarded-broker-transports.md'
]

tasks.register('checkDocumentation') {
    group = 'verification'
    description = 'Checks the V1 authority documents and their frozen revision markers.'
    doLast {
        v1DocumentPaths.each { path ->
            if (!file(path).isFile()) {
                throw new GradleException("required V1 document is missing: ${path}")
            }
        }
        def read = { path -> file(path).getText('UTF-8') }
        def revision = 'V1-FROZEN-2026-08-13'
        def design = read('docs/Nereus Delay V1 设计.md')
        def detailedDesign = read('docs/V1-DIRECT-SDK-GATEWAY-GUARDED-TRANSPORT-DETAILED-DESIGN.md')
        def registry = read('docs/V1-PROTOCOL-REGISTRY.md')
        def adrIndex = read('docs/adr/README.md')
        def documentMap = read('docs/README.md')
        def status = read('docs/IMPLEMENTATION-STATUS.md')
        def audit = read('docs/V1-DESIGN-AUDIT.md')

        [
                [design, "本文是 Nereus Delay V1 的实现与验收基线"],
                [design, '一个独立 RocksDB DB'],
                [registry, '唯一数值注册表'],
                [registry, 'IngressRouteSnapshotV1'],
                [adrIndex, '0001'],
                [adrIndex, '0044'],
                [detailedDesign, 'Direct Java SDK'],
                [detailedDesign, 'ResourceIncarnationMismatch = 26'],
                [detailedDesign, 'GatewayIdempotencyRecordV1'],
                [documentMap, '仍然有效'],
                [documentMap, 'IMPLEMENTATION-STATUS.md'],
                [status, revision],
                [audit, revision]
        ].each { entry ->
            if (!entry[0].contains(entry[1])) {
                throw new GradleException("V1 documentation invariant is missing: ${entry[1]}")
            }
        }

        def revisionMarkers = [
                design.find(/V1-FROZEN-\d{4}-\d{2}-\d{2}/),
                detailedDesign.find(/V1-FROZEN-\d{4}-\d{2}-\d{2}/),
                registry.find(/V1-FROZEN-\d{4}-\d{2}-\d{2}/),
                adrIndex.find(/V1-FROZEN-\d{4}-\d{2}-\d{2}/),
                status.find(/V1-FROZEN-\d{4}-\d{2}-\d{2}/),
                audit.find(/V1-FROZEN-\d{4}-\d{2}-\d{2}/)
        ]
        if (revisionMarkers.any { it != revision }) {
            throw new GradleException("V1 document revision markers are inconsistent: ${revisionMarkers}")
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('checkDocumentation')
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}
