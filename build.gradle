    toolVersion = '13.3.0'
    configFile = file('config/checkstyle/checkstyle.xml')
    maxErrors = 0
    maxWarnings = 0
}

tasks.withType(Checkstyle).configureEach {
    maxHeapSize = '1g'
    exclude '**/generated/**'
    exclude '**/generated-sources/**'
    exclude '**/generated-test-sources/**'
}

tasks.named('checkstyleMain').configure {
    source = fileTree('src/main/java')
}

tasks.named('checkstyleTest').configure {
    source = fileTree('src/test/java')
}

// The opt-in compiler writes the realPulsar source-set output directory that
// Checkstyle places on its analysis classpath.  Keep the default check gate
// independent of P1 artifacts, but order the two tasks when callers request
// both in the same invocation so Gradle never observes an implicit producer.
tasks.named('checkstyleRealPulsar').configure {
    mustRunAfter tasks.named('compileRealPulsar')
}

spotless {
    java {
        target 'src/**/*.java'
        palantirJavaFormat('2.80.0')
        importOrder '\\#|'
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

