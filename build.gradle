tasks.register('compileRealPulsar', JavaCompile) {
    group = 'verification'
    description = 'Compiles the Delay Pulsar binding against explicitly supplied locked P1 client artifacts.'
    dependsOn tasks.named('classes')
    if (realPulsarClientClasspath == null) {
        doFirst {
            throw new GradleException(
                    'compileRealPulsar requires -PpulsarClientClasspath=/absolute/path/client.jar:api.jar:common.jar')
        }
    }
    source = sourceSets.realPulsar.java
    // See compileRealKafka: the real binding may call a shared Oxia-backed
    // authority, whose public signature is part of the main API surface.
    classpath = files(sourceSets.main.output, sourceSets.main.compileClasspath,
            realPulsarClientClasspath.split(File.pathSeparator))
    destinationDirectory = layout.buildDirectory.dir('classes/java/realPulsar')
    options.release = 21
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all', '-Werror']
}

tasks.register('runRealPulsarSmoke', JavaExec) {
    group = 'verification'
    description = 'Runs the P1 Delay binding API/evidence smoke against the locked client artifact.'
    dependsOn tasks.named('compileRealPulsar')
    if (realPulsarClientClasspath == null) {
        doFirst {
            throw new GradleException(
                    'runRealPulsarSmoke requires -PpulsarClientClasspath=/absolute/path/client.jar:api.jar:common.jar')
        }
    }
    classpath = files(sourceSets.main.runtimeClasspath,
            sourceSets.realPulsar.output, realPulsarClientClasspath.split(File.pathSeparator))
    mainClass = 'io.nereusstream.delay.transport.PulsarClientArtifactBindingSmoke'
}

tasks.register('runRealPulsarServiceSmoke', JavaExec) {
    group = 'verification'
    description = 'Runs the P1 guarded binding against an explicitly supplied Pulsar service and admin endpoint.'
    dependsOn tasks.named('compileRealPulsar')
    if (realPulsarClientClasspath == null || realPulsarRuntimeDir == null
            || findProperty('pulsarServiceUrl') == null
            || findProperty('pulsarAdminUrl') == null || findProperty('pulsarTopic') == null) {
        doFirst {
            throw new GradleException(
                    'runRealPulsarServiceSmoke requires -PpulsarClientClasspath=... '
                            + '-PpulsarRuntimeDir=/path/to/pulsar-distribution/lib '
                            + '-PpulsarServiceUrl=pulsar://host:6650 -PpulsarAdminUrl=http://host:8080 '
                            + '-PpulsarTopic=topic')
        }
    }
    doFirst {
        if (!file(realPulsarRuntimeDir).isDirectory()) {
            throw new GradleException('pulsarRuntimeDir must be an extracted P1 distribution lib directory')
        }
    }
    // Keep the real client run isolated from the semantic module's unrelated
    // Netty/SLF4J runtime graph.  The locked P1 distribution owns these ABI
    // versions; only Delay bytecode plus the explicit P1 graph is required.
    classpath = files(sourceSets.main.output,
            sourceSets.realPulsar.output, realPulsarClientClasspath.split(File.pathSeparator),
            fileTree(realPulsarRuntimeDir).include('**/*.jar'))
    mainClass = 'io.nereusstream.delay.transport.PulsarClientArtifactRealServiceSmoke'
    args findProperty('pulsarServiceUrl'), findProperty('pulsarAdminUrl'), findProperty('pulsarTopic')
}

