}

tasks.register('testNdip1PersistentCertificationValidators', Exec) {
    group = 'verification'
    description = 'Runs fail-closed tests for disposable evidence, persistent Gate C, SHADOW, and final-chain validators.'
    workingDir projectDir
    commandLine 'python3', '-B', '-m', 'unittest',
            'scripts/test_verify_disposable_local_certification.py',
            'e2e/test_validate_ndip1_shadow_observation.py',
            'e2e/test_validate_ndip1_persistent_certification.py'
}

tasks.register('checkDocumentation') {
    group = 'verification'
    description = 'Checks current authority documents, accepted proposals, NDIP receipts, and baseline revision.'
    dependsOn tasks.named('verifyNdip1PackageAccepted')
    dependsOn tasks.named('testNdip1PackageVerifier')
    doLast {
        designDocumentPaths.each { path ->
            if (!file(path).isFile()) {
                throw new GradleException("required design-governance document is missing: ${path}")
            }
        }
        def read = { path -> file(path).getText('UTF-8') }
        def revision = 'DESIGN-BASELINE-2026-08-25'
        def design = read('docs/Nereus Delay 设计.md')
        def detailedDesign = read('docs/DIRECT-SDK-GATEWAY-GUARDED-TRANSPORT-DETAILED-DESIGN.md')
        def registry = read('docs/PROTOCOL-REGISTRY.md')
        def adrIndex = read('docs/adr/README.md')
        def documentMap = read('docs/README.md')
        def status = read('docs/IMPLEMENTATION-STATUS.md')
        def audit = read('docs/DESIGN-AUDIT.md')
        def proposalIndex = read('docs/proposals/README.md')
        def proposalTemplate = read('docs/proposals/TEMPLATE.md')
        def governanceProposal = read('docs/proposals/0001-adopt-continuous-design-evolution.md')
        def ndipGovernanceProposal = read('docs/proposals/0002-register-ndip-governance.md')
        def ndipIndex = read('docs/ndip/README.md')
        def ndipPackageReadme = read('docs/ndip/NDIP-1/README.md')
        def dataResetAssessmentStatus = read('docs/ndip/NDIP-1/G0-DataResetAssessment-执行状态.md')

        [
                [design, '本文是 Nereus Delay 当前实现与验收基线'],
                [design, '一个独立 RocksDB DB'],
                [registry, '唯一数值注册表'],
                [registry, 'IngressRouteSnapshot'],
                [adrIndex, '0001'],
                [adrIndex, '0044'],
                [detailedDesign, 'Direct Java SDK'],
                [detailedDesign, 'ResourceIncarnationMismatch = 26'],
                [detailedDesign, 'GatewayIdempotencyRecord'],
                [documentMap, '不是废弃文档'],
                [documentMap, 'IMPLEMENTATION-STATUS.md'],
                [documentMap, 'ndip/'],
                [proposalIndex, '兼容不是默认目标'],
                [proposalIndex, 'NDP-0002'],
                [proposalTemplate, '数据、协议与兼容策略'],
                [governanceProposal, 'Status: Accepted'],
                [governanceProposal, '选择：**直接替换**'],
                [ndipGovernanceProposal, 'Status: Accepted'],
                [ndipGovernanceProposal, 'candidate 永远不产生 authority'],
                [ndipIndex, 'NDIP-1'],
                [ndipIndex, 'Gate B PASS'],
                [ndipPackageReadme, '提案状态：`Accepted`'],
                [ndipPackageReadme, 'acceptance-receipt.json'],
                [ndipPackageReadme, 'H1 READY'],
                [dataResetAssessmentStatus, 'NOT_APPLICABLE_FOR_IMPLEMENTATION'],
                [dataResetAssessmentStatus, 'PENDING_DEPLOYMENT'],
                [status, revision],
                [audit, revision]
        ].each { entry ->
            if (!entry[0].contains(entry[1])) {
                throw new GradleException("documentation invariant is missing: ${entry[1]}")
            }
        }

        if (file('docs/ndip/NDIP-1/acceptance-receipt.candidate.json').exists()) {
            throw new GradleException(
                    'NDIP-1 candidate receipt must not remain after the Accepted transition')
        }

        def revisionMarkers = [
                design.find(/DESIGN-BASELINE-\d{4}-\d{2}-\d{2}/),
                detailedDesign.find(/DESIGN-BASELINE-\d{4}-\d{2}-\d{2}/),
                registry.find(/DESIGN-BASELINE-\d{4}-\d{2}-\d{2}/),
                adrIndex.find(/DESIGN-BASELINE-\d{4}-\d{2}-\d{2}/),
                status.find(/DESIGN-BASELINE-\d{4}-\d{2}-\d{2}/),
                audit.find(/DESIGN-BASELINE-\d{4}-\d{2}-\d{2}/)
        ]
        if (revisionMarkers.any { it != revision }) {
            throw new GradleException("document baseline revisions are inconsistent: ${revisionMarkers}")
        }
    }
}

tasks.register('checkProjectVersionMarkers', Exec) {
