    classpath = files(sourceSets.main.runtimeClasspath, sourceSets.realKafka.output, realKafkaClientJar)
    mainClass = 'io.nereusstream.delay.transport.KafkaClientArtifactTcpFaultProxy'
    args proxyProperties.collect { findProperty(it) }
