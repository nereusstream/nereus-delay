plugins {
    id 'java-library'
    id 'jacoco'
    id 'checkstyle'
}

group = 'io.nereusstream'
version = '0.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
    withJavadocJar()
}

dependencies {
    api 'org.rocksdb:rocksdbjni:10.1.3'
    api 'io.github.oxia-db:oxia-client:0.9.0'
    implementation platform('io.grpc:grpc-bom:1.75.0')
    implementation platform('io.opentelemetry:opentelemetry-bom:1.63.0')
    implementation platform('io.opentelemetry:opentelemetry-bom-alpha:1.63.0-alpha')
    implementation 'io.opentelemetry:opentelemetry-api:1.63.0'

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Oxia's structured logger discovers a backend only when a real client is opened.
    // Keep the default library surface backend-neutral, but make the opt-in real-service
    // test runnable from Gradle without relying on a host application's logging setup.
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.17'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs += ['-Xlint:all', '-Werror']
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.addBooleanOption('Xdoclint:all', true)
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    failFast = false
    testLogging {
        events 'failed', 'skipped'
    }
}

checkstyle {
    toolVersion = '10.26.1'
    configFile = file('config/checkstyle/checkstyle.xml')
    maxWarnings = 0
}

tasks.named('checkstyleTest').configure {
    enabled = false
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}
