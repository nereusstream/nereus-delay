tasks.register('runRealCrossLargePayloadGatewaySmoke', JavaExec) {
    group = 'verification'
    description = 'Runs the real cross-adapter Gateway/Oxia/Broker/Worker/MinIO large-payload authority E2E.'
    dependsOn tasks.named('compileRealCross')
    if (realKafkaClientJar == null || realPulsarClientClasspath == null || realPulsarRuntimeDir == null
            || findProperty('kafkaBootstrap') == null || findProperty('pulsarServiceUrl') == null
            || findProperty('pulsarAdminUrl') == null || findProperty('crossDirection') == null) {
        doFirst {
            throw new GradleException(
                    'runRealCrossLargePayloadGatewaySmoke requires -PkafkaClientJar=... '
                            + '-PpulsarClientClasspath=... -PpulsarRuntimeDir=/path/to/pulsar/lib '
                            + '-PkafkaBootstrap=host:port -PpulsarServiceUrl=pulsar://host:6650 '
                            + '-PpulsarAdminUrl=http://host:8080 -PcrossDirection=K_TO_P|P_TO_K')
        }
    }
    doFirst {
        if (!file(realPulsarRuntimeDir).isDirectory()) {
            throw new GradleException('pulsarRuntimeDir must be an extracted P1 distribution lib directory')
        }
    }
    // Keep the locked P1 distribution jars ahead of the shared Oxia client
    // runtime.  The shared build carries an older unshaded netty-buffer/common
    // pair for Oxia; P1's client is built against its exact 4.2.x family and
    // must own those classes when the two real-client bindings share one JVM.
    classpath = files(sourceSets.main.output, sourceSets.realKafka.output, sourceSets.realPulsar.output,
            sourceSets.realCross.output, realKafkaClientJar,
            realPulsarClientClasspath.split(File.pathSeparator),
            fileTree(realPulsarRuntimeDir).include('**/*.jar'), sourceSets.main.runtimeClasspath)
    mainClass = 'io.nereusstream.delay.transport.CrossAdapterLargePayloadGatewaySmoke'
    args findProperty('kafkaBootstrap'), findProperty('pulsarServiceUrl'), findProperty('pulsarAdminUrl'),
            findProperty('crossDirection')
}

