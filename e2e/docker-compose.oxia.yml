services:
  oxia:
    build:
      context: ${NEREUS_DELAY_OXIA_CHECKOUT:-../../../oxia}
      dockerfile: Dockerfile
    command:
      - oxia
      - standalone
      - --public-addr
      - 0.0.0.0:6648
      - --metrics-addr
      - 0.0.0.0:8080
      - --wal-dir
      - /tmp/nereus-delay-oxia-e2e/wal
      - --data-dir
      - /tmp/nereus-delay-oxia-e2e/db
    ports:
      - "127.0.0.1:${NEREUS_DELAY_OXIA_E2E_PORT:-16649}:6648"
