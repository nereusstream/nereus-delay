      - server
      - --public-addr
      - 0.0.0.0:6648
      - --internal-addr
      - 0.0.0.0:6649
      - --metrics-addr
      - 0.0.0.0:8080
      - --wal-dir
      - /var/lib/oxia/wal
      - --data-dir
      - /var/lib/oxia/db
    ports:
