      - oxia
      - server
      - --public-addr
      - 0.0.0.0:6648
      - --internal-addr
      - 0.0.0.0:6649
      - --metrics-addr
      - 0.0.0.0:8080
      - --wal-dir
      - /var/lib/oxia/wal
      - --data-dir
      - /var/lib/oxia/db
    ports:
      - "127.0.0.1:${NEREUS_DELAY_OXIA_DATA_SERVER_1_PORT:-16681}:6648"

  data-server-2:
    build:
      context: ${NEREUS_DELAY_OXIA_CHECKOUT:-../../../oxia}
