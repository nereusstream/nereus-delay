    command:
      - oxia
      - coordinator
      - --metadata
      - raft
      - --raft-bootstrap-nodes
      - coordinator-1:6645,coordinator-2:6645,coordinator-3:6645
      - --raft-address
      - coordinator-2:6645
      - --raft-data-dir
      - /var/lib/oxia/raft
      - --public-addr
      - 0.0.0.0:6651
      - --internal-addr
      - 0.0.0.0:6649
      - --metrics-addr
      - 0.0.0.0:8080
    ports:
      - "127.0.0.1:${NEREUS_DELAY_OXIA_COORDINATOR_2_PORT:-16692}:6651"

  coordinator-3:
