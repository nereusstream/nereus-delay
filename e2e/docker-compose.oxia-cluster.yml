      - 0.0.0.0:6651
      - --internal-addr
      - 0.0.0.0:6649
      - --metrics-addr
      - 0.0.0.0:8080
    ports:
      - "127.0.0.1:${NEREUS_DELAY_OXIA_COORDINATOR_3_PORT:-16693}:6651"

  data-server-1:
