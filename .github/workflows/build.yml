name: Build
run-name: "Build (${{ github.event_name }})${{ github.event_name == 'push' && format(' - {0}', github.event.head_commit.message) || github.event_name == 'pull_request' && format(' - PR #{0}', github.event.pull_request.number) || '' }}"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '7/15 * * * *'
      timezone: 'Asia/Shanghai'

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out sources
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Compile, test, and check Java code
        run: >-
          ./gradlew clean jar test spotlessCheck
          checkstyleMain checkstyleTest
          checkstyleRealCross checkstyleRealKafka checkstyleRealPulsar
          --no-build-cache --no-daemon --console=plain

      - name: Validate E2E shell scripts
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' script; do
            bash -n "$script"
            count=$((count + 1))
          done < <(find e2e -type f -name '*.sh' -print0)
          test "$count" -gt 0
          echo "Validated $count E2E shell scripts."
